<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Kulfi Corner</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css">

</head>


<body>


<!-- =====================================================
     NAVBAR
====================================================== -->

<header class="navbar">

    <div class="navbar-container">

        <a href="index.html" class="logo">
            <img
                src="KULF CORNER.png"
                alt="Kulfi Corner"
                class="logo-image">
        </a>


        <nav class="nav-menu" id="navMenu">

            <a href="index.html#home"
               class="nav-link">
                HOME
            </a>

            <a href="index.html#our-kulfis"
               class="nav-link">
                OUR KULFIS
            </a>

            <a href="index.html#our-story"
               class="nav-link">
                OUR STORY
            </a>

            <a href="index.html#how-we-make"
               class="nav-link">
                HOW WE MAKE
            </a>

            <a href="index.html#store"
               class="nav-link">
                STORE
            </a>

            <a href="index.html#contact"
               class="nav-link">
                CONTACT
            </a>

        </nav>


        <button
            class="menu-toggle"
            id="menuToggle"
            aria-label="Menu">

            <span></span>
            <span></span>
            <span></span>

        </button>

    </div>

</header>



<!-- =====================================================
     PRODUCT PAGE
====================================================== -->

<main class="product-page">


    <section class="product-detail">


        <!-- LEFT IMAGE -->

        <div class="product-image-section">

            <div class="product-image-box">

                <img
                    id="productImage"
                    src=""
                    alt="Kulfi">

            </div>

            <div class="fresh-product-badge">

                <span>MADE</span>

                FRESH

                <small>DAILY</small>

            </div>

        </div>



        <!-- RIGHT CONTENT -->

        <div class="product-content">


            <p class="product-label">
                AUTHENTIC INDIAN KULFI
            </p>


            <p class="product-number"
               id="productNumber">
                01
            </p>


            <h1 id="productName">
                Malai Kulfi
            </h1>


            <div class="product-rating">

                <span>★★★★★</span>

                <small>
                    Premium Kulfi
                </small>

            </div>


            <p
                class="product-description"
                id="productDescription">
            </p>


            <!-- INGREDIENTS -->

            <div class="product-info">

                <h3>
                    Ingredients
                </h3>

                <p id="productIngredients">
                </p>

            </div>


            <!-- SPECIALITY -->

            <div class="product-info">

                <h3>
                    Our Speciality
                </h3>

                <p id="productSpeciality">
                </p>

            </div>


            <!-- ACTIONS -->

            <div class="product-actions">

                <a
                    href="index.html#our-kulfis"
                    class="back-button">

                    ← BACK TO OUR KULFIS

                </a>

                <a
                    href="index.html#contact"
                    class="enquiry-button">

                    ENQUIRE

                </a>

            </div>

        </div>

    </section>


</main>



<script src="product.js"></script>

</body>

</html>
